# Template only: copy into your existing Prometheus installation after review.
# Do not install a second metrics server on the 2 GB app VM without capacity review.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/tiger-alerts.yml
scrape_configs:
  - job_name: cashcompass-tiger
    scheme: https
    metrics_path: /metrics # Replace with the exact path from Tiger Console.
    basic_auth:
      username: REPLACE_WITH_EXPORTER_USERNAME
      password_file: /run/secrets/tiger-exporter-password
    static_configs:
      - targets: [replace-with-exporter-host.example:443]
# Connect your existing Alertmanager to route notifications. Rules alone do not notify.
