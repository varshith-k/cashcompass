<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">CashCompass MoneyQuest</title>
  <desc id="description">The CashCompass compass needle above the MoneyQuest name on a navy blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#004977"/>
      <stop offset="1" stop-color="#0b263f"/>
    </linearGradient>
    <linearGradient id="ccMarkGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0276b1"/>
      <stop offset="1" stop-color="#004977"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <circle cx="256" cy="174" r="165" fill="none" stroke="#53b5ed" stroke-opacity="0.12"/>
  <circle cx="256" cy="174" r="144" fill="none" stroke="#53b5ed" stroke-opacity="0.12"/>
  <text x="256" y="40" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" text-anchor="middle">CASHCOMPASS</text>
  <!-- Original CashCompass mark, matching src/app/icon.svg. -->
  <g transform="translate(136 54) scale(5)">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ccMarkGradient)"/>
    <g transform="rotate(20 24 24)">
      <path d="M24 8 L29.5 24 L24 40 Z" fill="#ffffff"/>
      <path d="M24 8 L18.5 24 L24 40 Z" fill="#ffffff" opacity="0.5"/>
    </g>
    <circle cx="24" cy="24" r="2.75" fill="#004977"/>
    <circle cx="24" cy="24" r="1.5" fill="#53b5ed"/>
  </g>
  <text x="256" y="378" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" letter-spacing="-3" text-anchor="middle">MONEY</text>
  <text x="256" y="468" fill="#5ee1c3" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" letter-spacing="-3" text-anchor="middle">QUEST</text>
</svg>
